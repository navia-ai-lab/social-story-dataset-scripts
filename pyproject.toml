[project]
name = "fabula-dataset"
version = "0.1.0"
description = "Data generation scripts for Social Stories and Learner Profiles"
readme = "README.md"
authors = [
    { name = "Alan-J-Bibins", email = "alanjbibins@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.29.0",
    "openai>=3.29.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
generate_learner_profile = "fabula_dataset.scripts.learner_profile.generate_profiles:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
